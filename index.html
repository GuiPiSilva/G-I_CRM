function financialMetrics(){const paid=db.finances.filter(t=>t.status==='Pago'&&t.type==='income'),expenses=db.finances.filter(t=>t.status==='Pago'&&t.type==='expense'),income=paid.reduce((s,x)=>s+num(x.amount),0),spent=expenses.reduce((s,x)=>s+num(x.amount),0),receivable=db.finances.filter(t=>t.type==='income'&&t.status==='Pendente').reduce((s,x)=>s+num(x.amount),0),payable=db.finances.filter(t=>t.type==='expense'&&t.status==='Pendente').reduce((s,x)=>s+num(x.amount),0);return {income,spent,profit:income-spent,receivable,payable};}
function monthMetrics(key){const tx=db.finances.filter(x=>monthKey(x.date)===key&&x.status==='Pago');return {income:tx.filter(x=>x.type==='income').reduce((s,x)=>s+num(x.amount),0),spent:tx.filter(x=>x.type==='expense').reduce((s,x)=>s+num(x.amount),0)};}
function barChart(){let arr=[];for(let o=-5;o<=0;o++){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+o);arr.push({key:d.toISOString().slice(0,7),label:monthName(o)})}let vals=arr.map(x=>({...x,...monthMetrics(x.key)})),max=Math.max(1,...vals.map(x=>Math.max(x.income,x.spent)));return `<div class="chart-bars">${vals.map(x=>`<div class="chart-set" title="${e(x.label)}: receitas ${m(x.income)}, despesas ${m(x.spent)}"><div class="bar income" style="height:${Math.max(2,x.income/max*100)}%"></div><div class="bar expense" style="height:${Math.max(2,x.spent/max*100)}%"></div></div>`).join('')}</div><div class="month-labels">${vals.map(x=>`<span>${e(x.label)}</span>`).join('')}</div>`;}
function donut(){const stages=[['Novo','#086991'],['Conversando','#7aa8c9'],['Proposta enviada','#a5c5d9'],['Fechado','#e9f1f6']];const total=db.deals.filter(x=>x.stage!=='Perdido').length;let last=0,parts=[];stages.forEach(([name,color])=>{let pct=total?db.deals.filter(x=>x.stage===name).length/total*100:0;parts.push(`${color} ${last}% ${last+pct}%`);last+=pct});return `<div class="ratio-wrap"><div class="donut" style="background:${total?'conic-gradient('+parts.join(',')+')':'#edf3f6'}"><div class="donut-center"><strong>${total}</strong><small>negócios</small></div></div><div class="pipeline-legend">${stages.map(([name,color])=>`<div class="pipeline-row"><span><i class="pipeline-dot" style="background:${color}"></i>${name}</span><strong>${db.deals.filter(x=>x.stage===name).length}</strong></div>`).join('')}</div></div>`;}

// A single user gesture now both signs in and grants the CRM's Google permissions.
function requestGoogleToken({full=false,automatic=false,forLogin=false}={}){
 if(googleConfig.status!=='ready'||!googleConfig.clientId)return automatic?undefined:toast('Configure o Client ID do Google na Vercel.',true);
 if(!window.google?.accounts?.oauth2)return automatic?undefined:toast('Google indisponível. Atualize a página.',true);
 try{
  googleClient=window.google.accounts.oauth2.initTokenClient({
   client_id:googleConfig.clientId,
   scope:forLogin?'openid email profile '+SCOPES:full?DRIVE_SCOPE:SCOPES,
   login_hint:authUser?.email||undefined,
   callback: async response=>{
     if(response.error||!response.access_token){
       cloudStatus='reconectar';cloudLastError=response.error_description||response.error||'O Google não retornou um token.';
       if(!automatic)toast('Google precisa de autorização: '+cloudLastError,true);
       if(authState==='ready')renderContent();
       return;
     }
     if(forLogin){
       if(!window.google.accounts.oauth2.hasGrantedAllScopes(response,
         'https://www.googleapis.com/auth/drive.file','https://www.googleapis.com/auth/spreadsheets')){
         toast('É preciso permitir Drive e Planilhas para conectar tudo no login. Você também pode entrar sem essa conexão.',true);
         return;
       }
       try{
         const result=await fetch('/api/auth',{method:'POST',credentials:'same-origin',
          headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:response.access_token})});
         const payload=await result.json();
         if(!result.ok)throw Error(payload.error||'Não foi possível concluir o login.');
         authUser=payload.user;authState='ready';autoAuthAttempted=false;
       }catch(err){toast(err.message||'Falha no login Google.',true);return;}
     }
     googleToken=response.access_token;oauthTokenExpires=Date.now()+Math.max(30,Number(response.expires_in)||3600)*1000;
     driveAccess=full?'full':'basic';cloudStatus='sincronizando';cloudLastError='';
     if(googleConfig.crmSheetId){db.settings.sheetId=googleConfig.crmSheetId;db.settings.autoSync=true;save(false)}
     render();
     if(forLogin)startGoogleAutoReconnect();
     if(full){openDrive('root');setTimeout(()=>giEnsurePendingFolders(),1100);}
     queueCloudSync(20);
     if(!automatic)toast(forLogin?'Login realizado e Google conectado!':'Google autorizado. Sincronização automática ativada.');
   },
   error_callback:err=>{
     cloudStatus='reconectar';cloudLastError='O navegador não conseguiu concluir a autorização Google.';
     if(!automatic)toast('Verifique se o navegador permite a janela de autorização do Google.',true);
     if(page==='integrations'&&authState==='ready')renderContent();
   }
  });
  // Directly inside the user's click handler: avoids browsers blocking a popup
  // opened asynchronously after the separate Google Sign-In callback.
  googleClient.requestAccessToken({prompt:automatic?'':'select_account'});
 }catch(err){
   cloudStatus='reconectar';cloudLastError=err.message||'Falha de autorização';
   if(!automatic)toast('Falha no Google: '+cloudLastError,true);
 }
}

}

function cloudMerge(remote){

 for(const t of [...(remote.deletedRecords||[]),...(db.settings.deletedRecords||[]),...Object.entries(DEMO_RECORD_IDS).flatMap(([kind,ids])=>ids.map(id=>({kind,id,updatedAt:DEMO_CLEAR_DATE})))]){
  if(!SYNC_TYPES.includes(t.kind)||!t.id)continue;
  const k=t.kind+'::'+t.id,prior=latestTomb.get(k);
  if(!prior||modified(t)>modified(prior))latestTomb.set(k,t);
 }
 merged.deletedRecords=[...latestTomb.values()];
 for(const kind of SYNC_TYPES){const map=new Map();
  // Remote wins ties to avoid accidental replacement by stale tabs.
  for(const x of [...(db[kind]||[]),...(remote[kind]||[])]){
   if(!x?.id)continue;const prior=map.get(x.id);if(!prior||modified(x)>=modified(prior))map.set(x.id,x);
  }
  merged[kind]=[...map.values()].filter(x=>{if(DEMO_ID_SETS[kind]?.has(x.id))return false;const tomb=latestTomb.get(kind+'::'+x.id);return !tomb||modified(tomb)<modified(x)}).sort((a,b)=>String(a.id).localeCompare(String(b.id)));
 }

}

  {range:'Exclusoes!A1',values:[['kind','id','updatedAt'],...snapshot.deletedRecords.map(t=>[t.kind,t.id,t.updatedAt])]}

async function cloudSync(){
 if(isSyncing){syncAgain=true;return}if(!googleToken||!googleConfig.crmSheetId||authState!=='ready')return;
 isSyncing=true;cloudStatus='sincronizando';const startEdit=cloudEditVersion;
 try{
  const remote=await sharedFetch(),merged=cloudMerge(remote);
  if(cloudSignature(merged)!==cloudSignature(remote))await cloudWrite(merged,remote);
  // Never overwrite changes made while a network request was in flight.
  const changedLocally=cloudSignature(merged)!==cloudSignature({...db,deletedRecords:db.settings.deletedRecords});
  if(cloudEditVersion===startEdit){for(const kind of SYNC_TYPES)db[kind]=merged[kind];db.settings.deletedRecords=merged.deletedRecords;}
  db.settings.sheetId=googleConfig.crmSheetId;db.settings.autoSync=true;db.settings.lastSync=new Date().toISOString();save(false);
  if(googleConfig.clientsSheetId&&!secondaryDemoScrubbed){try{await scrubSecondaryDemoClients()}catch(err){console.warn('A limpeza dos antigos clientes de exemplo está pendente:',err.message)}}
  cloudStatus='sincronizado';cloudLastError='';if(authState==='ready'&&changedLocally&&!document.querySelector('.modal-backdrop'))render();else if(page==='integrations')renderContent();
  if(driveAccess==='full')giEnsurePendingFolders();if(googleConfig.clientsSheetId){const pending=new Set(db.settings.pendingClients||[]);for(const c of db.clients||[]){if(!knownClientVersions.has(c.id)||knownClientVersions.get(c.id)!==modified(c))pending.add(c.id);}db.settings.pendingClients=[...pending];save(false);syncPendingClients();}
 }catch(err){cloudStatus='erro';cloudLastError=err.message||'Falha ao sincronizar';if(page==='integrations')renderContent();
  // Keep local edits safe. 401 requires manual reconnection; no silent token persistence.
  console.warn('G&I Central: sincronização pendente',cloudLastError);
 }finally{isSyncing=false;if(syncAgain||cloudEditVersion!==startEdit){syncAgain=false;queueCloudSync(250);}}
}

async function imagePixelSource(file){

async function removePhotoMetadata(file){

 const sig=String.fromCharCode(...prefix);
 let type='';
 if(prefix[0]===0xff&&prefix[1]===0xd8&&prefix[2]===0xff)type='image/jpeg';
 else if(prefix.slice(0,8).every((v,i)=>v===[137,80,78,71,13,10,26,10][i]))type='image/png';
 else if(sig.slice(0,4)==='RIFF'&&sig.slice(8,12)==='WEBP'){
  if(sig.slice(12,16)==='VP8X'&&(prefix[20]&2))throw Error('WebP animado não é suportado.');
  type='image/webp';
 }
 if(!type)throw Error('Formato não suportado ou imagem inválida.');
 if(type==='image/png'){
  // APNG (acTL) pode conter diversos frames; nao transformar em foto estatica sem avisar.
  const start=new Uint8Array(await file.slice(0,Math.min(file.size,2*1024*1024)).arrayBuffer());
  let pos=8;
  while(pos+12<=start.length){
   const len=((start[pos]*0x1000000)+(start[pos+1]<<16)+(start[pos+2]<<8)+start[pos+3])>>>0;
   const chunk=String.fromCharCode(...start.slice(pos+4,pos+8));
   if(chunk==='acTL')throw Error('PNG animado (APNG) não é suportado.');
   if(chunk==='IDAT'||len>start.length-pos-12)break;
   pos+=len+12;
  }
 }
 let obj=await imagePixelSource(file),canvas=document.createElement('canvas');
 try{
  if(!obj.width||!obj.height||obj.width*obj.height>META_MAX_PIXELS)throw Error('Resolução muito alta para processar com segurança neste aparelho.');
  canvas.width=obj.width;canvas.height=obj.height;
  const ctx=canvas.getContext('2d',{alpha:type!=='image/jpeg'});
  if(!ctx)throw Error('Seu navegador não oferece suporte ao processamento de imagens.');
  if(type==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);}

}

const giCreating=new Set();let giBackfilling=false,giGalleryId='',giGalleryFiles=[],giGalleryObjectUrls=[];
function giFolderName(client){return String(client.company||client.name||"Cliente").trim().slice(0,72)+" · "+String(client.id).slice(0,8);}

async function giEnsureClientFolder(cid,silent=false){
 const client=db.clients.find(c=>c.id===cid);
 if(!client)return "";
 if(client.driveFolderId)return client.driveFolderId;
 if(!googleToken||driveAccess!=="full"){
  if(!silent)toast("Autorize suas pastas do Google Drive em Arquivos para ativar as artes deste cliente.",true);
  return "";
 }
 if(giCreating.has(cid))return "";
 giCreating.add(cid);
 try{
  const title=giFolderName(client);
  const quote=v=>String(v).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
  const q="'1XNm3H5jIehlIzaXGYG5KDJgSgn72Q9Rq' in parents and name = '"+quote(title)+"' and mimeType = 'application/vnd.google-apps.folder' and trashed = false";
  const matches=await driveList(q);
  const item=matches[0]||await gpost(DRIVE+"/files?fields=id,name",{name:title,mimeType:"application/vnd.google-apps.folder",parents:["1XNm3H5jIehlIzaXGYG5KDJgSgn72Q9Rq"]});
  if(!item?.id)throw Error("Google não retornou o ID da pasta.");
  client.driveFolderId=item.id;client.updatedAt=new Date().toISOString();save();scheduleClientSync(cid);
  if(!silent)toast("Pasta do cliente pronta.");
  if(page==="clients")renderContent();
  return item.id;
 }catch(err){if(!silent)toast("Não foi possível criar a pasta: "+err.message,true);throw err;}finally{giCreating.delete(cid);}
}

 const title=e(client.company||client.name||"Cliente");

 const markup=`
 <div class="modal-backdrop" data-action="modal-close-bg">
  <div class="modal gi-media-modal" role="dialog" aria-modal="true" aria-label="Artes de ${title}">
   <div class="modal-head">

    <button class="modal-close" type="button" data-action="modal-close" aria-label="Fechar">${I("close",18)}</button>
   </div>
   <div class="modal-body">

     ${folder}

     <input id="gi-gallery-file" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
    </div>
    <p class="g-note gi-media-status" role="status">${e(status||"")}</p>
    <div class="gi-media-grid">${cards||empty}</div>
   </div>
  </div>
 </div>`;
 document.getElementById("overlay-root").innerHTML=markup;
 const input=document.getElementById("gi-gallery-file"),button=document.getElementById("gi-gallery-upload");

async function giOpenClientGallery(cid){
 const client=db.clients.find(x=>x.id===cid);if(!client)return;
 if(!googleToken||driveAccess!=="full"){toast("Para abrir as artes, clique em Arquivos e autorize suas pastas do Drive.",true);navigate("drive");return;}

async function giLoadClientMedia(cid){
 const c=db.clients.find(x=>x.id===cid);if(!c?.driveFolderId)return;
 giGalleryObjectUrls.forEach(u=>URL.revokeObjectURL(u));giGalleryObjectUrls=[];
 const q="'"+String(c.driveFolderId).replace(/'/g,"\\'")+"' in parents and trashed = false and mimeType contains 'image/'";
 const params=new URLSearchParams({q,fields:"nextPageToken,files(id,name,mimeType,webViewLink,thumbnailLink,size)",pageSize:"100"});
 const data=await gapi(DRIVE+"/files?"+params.toString());
 const images=(data.files||[]).filter(x=>/^image\/(jpeg|png|webp)$/i.test(x.mimeType||""));
 giGalleryFiles=images;giMediaShell(c,images,images.length+" imagem(ns) nesta pasta.");
 // Use Google OAuth, not public sharing links, to render private image previews.
 for(const f of images.slice(0,20)){
  if(cid!==giGalleryId)break;
  try{
   const response=await fetch(DRIVE+"/files/"+encodeURIComponent(f.id)+"?alt=media",{headers:{Authorization:"Bearer "+googleToken}});
   if(!response.ok)continue;
   const blob=await response.blob();
   if(!/^image\/(jpeg|png|webp)$/.test(blob.type))continue;
   f.preview=URL.createObjectURL(blob);giGalleryObjectUrls.push(f.preview);
  }catch(err){console.warn("Miniatura indisponível",err.message);}
 }
 if(cid===giGalleryId&&document.getElementById("gi-gallery-upload"))giMediaShell(c,images,images.length+" imagem(ns) nesta pasta.");
}

async function giUploadClientMedia(cid,files){
 const c=db.clients.find(x=>x.id===cid);if(!c?.driveFolderId||!googleToken)return toast("Pasta do cliente indisponível.",true);
 let sent=0,failed=0;
 giMediaShell(c,giGalleryFiles,"Enviando imagens...");
 for(const file of files){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size===0||file.size>15*1024*1024){failed++;continue;}
  try{
   const boundary="gi"+Math.random().toString(36).slice(2);
   const meta=JSON.stringify({name:file.name.slice(0,160),parents:[c.driveFolderId]});
   const bytes=new Blob(["--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+meta+"\r\n--"+boundary+"\r\nContent-Type: "+file.type+"\r\n\r\n",file,"\r\n--"+boundary+"--"]);
   const response=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:{Authorization:"Bearer "+googleToken,"Content-Type":"multipart/related; boundary="+boundary},body:bytes});
   if(!response.ok){const error=await response.json().catch(()=>({}));throw Error(error.error?.message||String(response.status));}
   sent++;
  }catch(err){failed++;console.warn("Falha no envio",err.message);}
 }
 try{await giLoadClientMedia(cid)}catch(err){toast("Imagens enviadas, mas não foi possível atualizar a galeria.",true);}
 toast(sent+" imagem(ns) enviada(s) ao cliente"+(failed?"; "+failed+" falharam.":"."),!!failed);
}

// CLIQUES E FORMULÁRIOS
function run(action,el){const type=el?.dataset.type,pid=el?.dataset.id;switch(action){case 'nav':navigate(el.dataset.page);break;case 'google-login-sync':requestGoogleToken({forLogin:true});break;case 'mobile-open':sidebarOpen=true;render();break;case 'mobile-close':sidebarOpen=false;render();break;case 'new':openModal(type,'',el.dataset.quick||'');break;case 'new-income':navigate('finances');openModal('finances','','income');break;case 'new-clients':openModal('clients');break;case 'gi-client-gallery':giOpenClientGallery(pid);break;case 'new-deals':openModal('deals');break;case 'new-projects':openModal('projects');break;case 'new-tasks':openModal('tasks');break;case 'new-scripts':openModal('scripts');break;case 'script-copy':GIRoteiros.copy(pid,{db,clientName,toast,download});break;case 'script-pdf':GIRoteiros.pdf(pid,{db,clientName,dateShort,e,toast});break;case 'edit':openModal(type,pid);break;case 'delete':removeEntity(type,pid);break;case 'modal-close':closeModal();break;case 'modal-close-bg':if(el===window.event?.target)closeModal();break;case 'show-lost':hideLost();break;case 'erase':localErase();break;case 'json-backup':download(`GI_backup_${iso()}.json`,JSON.stringify(db,null,2),'application/json;charset=utf-8');toast('Backup salvo.');break;case 'csv':exportCsv(type);break;case 'google-refresh-config':loadGoogleConfig();break;case 'google-connect':connectGoogle();break;case 'google-drive-connect':connectGoogle(true);break;case 'google-create':ensureBase();break;case 'google-upload':uploadData();break;case 'clients-sync-now':syncPendingClients();break;case 'google-download':downloadData();break;case 'project-folder':projectFolder(pid);break;case 'logout':logout();break;case 'quote-new':openQuote();break;case 'quote-edit':openQuote(pid);break;case 'quote-delete':deleteQuote(pid);break;case 'quote-print':printQuote(pid);break;case 'quote-row-add':addQuoteRow();break;case 'quote-row-remove':el.closest('tr')?.remove();updateQuoteTotals();break;case 'drive-open':openDrive(pid);break;case 'drive-up':openDrive('root');break;case 'drive-trash':trashDriveFile(pid);break;case 'drive-select':document.getElementById('drive-upload')?.click();break;case 'metadata-pick':document.getElementById('metadata-input')?.click();break;case 'metadata-run':cleanSelectedImages();break;case 'metadata-zip':downloadCleanZip();break;case 'metadata-download':downloadCleanImage(Number(el.dataset.index));break;case 'metadata-reset':resetMetadataQueue();break;case 'metadata-drive':sendCleanImagesToDrive();break;default:break}}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='modal-close-bg'&&event.target!==el)return;run(el.dataset.action,el)});
document.addEventListener('submit',event=>{if(event.target.id==='entity-form'){event.preventDefault();persistEntity(event.target)}else if(event.target.id==='quote-form'){event.preventDefault();saveQuote(event.target)}});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='drive-upload'){uploadDrivePhotos(el.files);el.value='';}else if(el.id==='metadata-input'){addMetadataImages(el.files);el.value='';}else if(el.classList.contains('quote-item-select')){const item=el.value===''?null:SERVICE_CATALOG[Number(el.value)];const tr=el.closest('tr');if(item&&tr){tr.querySelector('[name=title]').value=item.title;tr.querySelector('[name=price]').value=item.price;}updateQuoteTotals();}else if(el.id==='scripts-filter'){GIRoteiros.setFilter(el.value);renderContent();}else if(el.id==='finance-period'){monthFilter=el.value;renderContent();}else if(el.id==='finance-type'){filter=el.value;renderContent();}else if(el.id==='auto-sync'){toast('A sincronização é automática e não pode ser desativada aqui.');}else if(el.dataset.taskToggle){const x=db.tasks.find(x=>x.id===el.dataset.taskToggle);if(x){x.done=el.checked;x.updatedAt=new Date().toISOString();save();renderContent();toast(x.done?'Tarefa concluída.':'Tarefa reaberta.')}}});
document.addEventListener('input',event=>{const el=event.target;if(el.closest('#quote-form'))updateQuoteTotals();if(el.id==='global-search'||el.id==='local-search'){query=el.value;const other=document.querySelector(el.id==='global-search'?'#local-search':'#global-search');if(other)other.value=query;const focusPos=el.selectionStart;renderContent();if(el.id==='local-search'){const next=document.getElementById('local-search');if(next){next.focus();next.setSelectionRange(focusPos,focusPos)}}}});
document.addEventListener('dragover',event=>{if(event.target.closest?.('#metadata-dropzone')){event.preventDefault();event.dataTransfer.dropEffect='copy';}});
document.addEventListener('drop',event=>{if(event.target.closest?.('#metadata-dropzone')){event.preventDefault();addMetadataImages(event.dataTransfer?.files);}});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal();if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();document.getElementById('global-search')?.focus()}});
render();
loadGoogleConfig();
checkSession();
})();
</script>

<script>
(()=>{
 'use strict';
 const banner=document.getElementById('gi-app-install'),help=document.getElementById('gi-app-help');
 let installer=null;
 const android=/Android/i.test(navigator.userAgent||'');
 const installed=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
 const show=()=>{if(android&&!installed()&&!sessionStorage.getItem('gi-app-dismissed'))banner.hidden=false;};
 const hide=()=>banner.hidden=true;
 if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js?v=3',{scope:'/',updateViaCache:'none'}).catch(err=>console.warn('Serviço PWA:',err)));
 window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installer=event;show();});
 window.addEventListener('appinstalled',()=>{hide();installer=null;sessionStorage.setItem('gi-app-dismissed','1');});
 document.getElementById('gi-app-close').addEventListener('click',()=>{sessionStorage.setItem('gi-app-dismissed','1');hide();});
 document.getElementById('gi-app-cta').addEventListener('click',async()=>{
   if(!installer){help.hidden=false;return;}
   const prompt=installer;installer=null;
   try{await prompt.prompt();const decision=await prompt.userChoice;if(decision?.outcome==='accepted')hide();else help.hidden=false;}
   catch(e){help.hidden=false;console.warn('Instalação manual:',e);}
 });
 if(android)setTimeout(show,1000);
})();
</script>
